{% extends "base.html" %}
{% block title %}Consultar IA{% endblock %}
{% block content %}
<h2>Consultar IA</h2>

<form method="post" class="card">
    {% csrf_token %}
    <input type="text" name="pregunta" placeholder="Escribe tu pregunta" required>
    <button type="submit" class="btn">Preguntar</button>
</form>

{% if respuesta_ia %}
    <div class="respuesta-ia">
        <p>{{ respuesta_ia }}</p>
    </div>
{% endif %}
{% endblock %}
