{% extends "base.html" %}
{% block title %}Tareas{% endblock %}
{% block content %}
<h1>Tareas</h1>
<a class="btn" href="{% url 'crear_tarea' %}">+ Nueva tarea</a>

<ul class="list-plain">
    {% for tarea in tareas %}
        <li>
            <a href="{% url 'detalle_tarea' tarea.id %}">{{ tarea.titulo }}</a>
            <span class="badge">{{ tarea.estado }}</span>
        </li>
    {% empty %}
        <li class="muted">No hay tareas registradas.</li>
    {% endfor %}
</ul>
{% endblock %}


.text-muted {
    color: #9fa4a5;
}
