<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva tarea</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
        }
        h1 {
            border-bottom: 2px solid #444;
            padding-bottom: 8px;
        }
        a {
            text-decoration: none;
            color: #666;
        }
        form p {
            margin-bottom: 14px;
        }
        input, textarea, select {
            padding: 6px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background: #2a5db0;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background: #1f4a91;
        }
    </style>
</head>
<body>
    <a href="{% url 'lista_tareas' %}">&larr; Volver</a>
    <h1>Crear tarea</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
    </form>
</body>
</html>
