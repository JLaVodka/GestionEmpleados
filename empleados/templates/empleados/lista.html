{% extends "base.html" %}
{% block title %}Empleados{% endblock %}
{% block content %}
<h1>Empleados</h1>
<ul class="list-plain">
    {% for empleado in empleados %}
        <li><a href="{% url 'detalle_empleado' empleado.id %}">{{ empleado.nombre }}</a></li>
    {% empty %}
        <li class="muted">No hay empleados registrados.</li>
    {% endfor %}
</ul>
{% endblock %}
